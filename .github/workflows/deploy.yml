name: Provision Infrastructure (Terraform - Floci Local)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      enable_disposable_public_http:
        description: Expose the test ALB over plain HTTP (no TLS)
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: securecloud-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: secure-cloud-cluster-v2
  TF_WORKING_DIR: infra/terraform
  AWS_ROLE_ARN: arn:aws:iam::000000000000:role/github-actions-role
  TF_STATE_BUCKET: secure-cloud-microservices-tfstate-floci
  AWS_ENDPOINT_URL: http://localhost:4566

jobs:
  terraform:
    name: Terraform Apply
    runs-on: self-hosted
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          sts-endpoint: ${{ env.AWS_ENDPOINT_URL }}
          audience: sts.amazonaws.com

      - name: Verify AWS Identity
        run: aws sts get-caller-identity --endpoint-url $env:AWS_ENDPOINT_URL

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Bootstrap State Backend & Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          aws s3api head-bucket --bucket "$env:TF_STATE_BUCKET" --endpoint-url "$env:AWS_ENDPOINT_URL" 2>$null
          if ($LASTEXITCODE -ne 0) {
            aws s3api create-bucket --bucket "$env:TF_STATE_BUCKET" --region "$env:AWS_REGION" --endpoint-url "$env:AWS_ENDPOINT_URL"
          }
          terraform init -input=false -reconfigure

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Verify EKS Cluster Status
        run: |
          aws eks describe-cluster --endpoint-url "$env:AWS_ENDPOINT_URL" --name "$env:EKS_CLUSTER_NAME" --region "$env:AWS_REGION" --query 'cluster.status' --output text

      - name: Update Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --endpoint-url "$env:AWS_ENDPOINT_URL" --region "$env:AWS_REGION" --name "$env:EKS_CLUSTER_NAME"

      - name: Verify Cluster Nodes
        run: kubectl get nodes

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Update Helm Dependencies
        run: helm dependency update ./helm/securecloud

      - name: Install AWS Load Balancer Controller
        run: |
          $controller_role_arn = terraform -chdir=infra/terraform output -raw aws_load_balancer_controller_role_arn$vpc_id = terraform -chdir=infra/terraform output -raw vpc_id
          $values_file = "$env:RUNNER_TEMP/aws-load-balancer-controller-values.yaml"

          @"
          clusterName: $env:EKS_CLUSTER_NAME
          region: $env:AWS_REGION
          vpcId: $vpc_id
          serviceAccount:
            create: true
            name: aws-load-balancer-controller
            annotations:
              eks.amazonaws.com/role-arn: "$controller_role_arn"
          "@ | Out-File -FilePath $values_file -Encoding utf8

          helm repo add eks https://aws.github.io/eks-charts
          helm repo update eks
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller --version 1.13.4 --namespace kube-system --values "$values_file"
          kubectl rollout status deployment/aws-load-balancer-controller --namespace kube-system --timeout=5m

      - name: Deploy Helm Chart
        working-directory: ${{ github.workspace }}
        run: |
          $chart_path = "$env:GITHUB_WORKSPACE/helm/securecloud"
          $auth_service_role_arn = terraform -chdir=infra/terraform output -raw auth_service_role_arn$waf_web_acl_arn = terraform -chdir=infra/terraform output -raw waf_web_acl_arn

          if (!(Test-Path "$chart_path/Chart.yaml")) {
              Write-Error "Helm chart not found: $chart_path/Chart.yaml"
              exit 1
          }

          $isWorkflowDispatch = "${{ github.event_name }}" -eq "workflow_dispatch"
          $enablePublicHttp = $isWorkflowDispatch -and "${{ inputs.enable_disposable_public_http }}" -eq "true"

          helm upgrade --install securecloud-release "$chart_path" `
            --namespace securecloud `
            --create-namespace `
            --set-string authService.serviceAccount.roleArn="$auth_service_role_arn" `
            --set-string gateway.wafAclArn="$waf_web_acl_arn" `
            --set gateway.disposablePublicHttp=$enablePublicHttp `
            --set image.tag="${{ github.sha }}"

      - name: Verify WAF association
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_disposable_public_http }}
        run: |
          $alb_dns = ""
          for ($i=1; $i -le 60; $i++) {$alb_dns = kubectl get ingress api-gateway --namespace securecloud --output=jsonpath='{.status.loadBalancer.ingress[0].hostname}'
              if (![string]::IsNullOrEmpty($alb_dns)) { break }
              Start-Sleep -Seconds 10
          }

          if ([string]::IsNullOrEmpty($alb_dns)) {
              Write-Error "The api-gateway Ingress did not receive an ALB hostname."
              kubectl describe ingress api-gateway --namespace securecloud
              exit 1
          }

          $alb_arn = aws elbv2 describe-load-balancers --endpoint-url "$env:AWS_ENDPOINT_URL" --region "$env:AWS_REGION" --query "LoadBalancers[?DNSName=='$alb_dns'].LoadBalancerArn | [0]" --output text
          if ([string]::IsNullOrEmpty($alb_arn) -or$alb_arn -eq "None") {
              Write-Error "Could not resolve ALB ARN for hostname $alb_dns."
              exit 1
          }

          $expected_waf_arn = terraform -chdir=infra/terraform output -raw waf_web_acl_arn$actual_waf_arn = ""

          for ($i=1; $i -le 12; $i++) {
              try {
                  $actual_waf_arn = aws wafv2 get-web-acl-for-resource --endpoint-url "$env:AWS_ENDPOINT_URL" --region "$env:AWS_REGION" --resource-arn "$alb_arn" --query 'WebACL.ARN' --output text 2>&1
                  if ($actual_waf_arn -eq$expected_waf_arn) { break }
              } catch {}
              Start-Sleep -Seconds 10
          }

          if ($actual_waf_arn -ne$expected_waf_arn) {
              Write-Error "Expected WAF $expected_waf_arn on ALB $alb_arn, got:$actual_waf_arn"
              exit 1
          }